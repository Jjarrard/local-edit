[project]
name = "local-edit"
version = "0.1.0"
description = "A code-editing agent framework for tiny (1-3B) local models, hooked into Jan's local API."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
local-edit = "local_edit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_edit*"]
